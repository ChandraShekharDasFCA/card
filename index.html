<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandra Shekhar Das, FCA - Digital Business Card</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- html2canvas Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pragati: {
                            green: '#008744',
                            purple: '#7b1fa2',
                            teal: '#00796b',
                            dark: '#1e293b',
                            light: '#f8fafc'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .badge-gradient {
            background: linear-gradient(135deg, #008744 0%, #7b1fa2 100%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between items-center p-3 sm:p-6">

    <!-- Toast Notification for Actions -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-full shadow-2xl text-sm font-medium z-50 transition-all duration-300 opacity-0 pointer-events-none flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400" id="toast-icon"></i>
        <span id="toast-message">Message copied to clipboard</span>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-md bg-white rounded-3xl overflow-hidden card-shadow my-auto border border-slate-200/80 relative">
        
        <!-- Header Banner with Pragati Insurance Brand Gradient -->
        <div class="h-32 badge-gradient relative flex items-center justify-between px-6 pt-4">
            <div class="w-10"></div> <!-- Empty spacer to balance layout -->
            <div class="text-white text-xs font-bold tracking-widest uppercase drop-shadow-md text-center">Digital VCard</div>
            <button onclick="toggleShareModal()" class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md text-white flex items-center justify-center hover:bg-white/30 transition-all duration-200 focus:outline-none shrink-0" title="Share Card">
                <i class="fa-solid fa-share-nodes text-lg"></i>
            </button>
        </div>

        <!-- Profile Section -->
        <div class="px-6 pb-6 relative">
            <!-- Profile Avatar / Brand Logo Icon -->
            <div class="relative -mt-14 mb-4 flex justify-between items-end">
                <div class="w-24 h-24 rounded-2xl bg-white p-1.5 shadow-md border border-slate-100 flex items-center justify-center">
                    <!-- Pragati Logo Stylized SVG Icon -->
                    <div class="w-full h-full bg-slate-50 rounded-xl flex flex-col items-center justify-center p-2 relative overflow-hidden group">
                        <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Green Arrow Part -->
                            <path
